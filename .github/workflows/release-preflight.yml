name: Release Preflight

on:
  workflow_dispatch:

permissions: {}

jobs:
  validate:
    name: Validate release commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require commit from default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Release commit $GITHUB_SHA is not reachable from $DEFAULT_BRANCH."
            exit 1
          fi

      - name: Mark preflight pending
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=pending \
            -f context=release-preflight \
            -f description="Release preflight is running" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  build:
    needs: validate
    permissions:
      contents: read
    uses: ./.github/workflows/build-guidelines.yml
    with:
      enforce_spec_lock: true

  record:
    name: Record preflight result
    if: always()
    needs:
      - validate
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Record preflight result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_RESULT: ${{ needs.validate.result }}
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          state=failure
          description="Release preflight failed"
          if [[ "$VALIDATE_RESULT" == "success" && "$BUILD_RESULT" == "success" ]]; then
            state=success
            description="Release preflight passed"
          fi

          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context=release-preflight \
            -f description="$description" \
            -f target_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          if [[ "$state" != "success" ]]; then
            exit 1
          fi
